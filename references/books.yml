# books.yml: non-fiction books referenced in the Lenny corpus.
#
# Seeded from podcast guest authorship + verified corpus mentions (grep counts
# included). Books not authored by guests but heavily cited by Lenny himself
# (Cagan's Inspired, Kahneman's Thinking Fast and Slow, etc.) are also seeded.
#
# Mentions are best-effort: run `python3 scripts/book_mentions.py --book <slug>`
# to get the canonical, dated mention list before generating a book digest.
#
# Schema:
#
# books:
#   <slug>:
#     title: "Full Title"
#     author: "Author Name"
#     aliases:               # alternate titles or distinctive phrases
#     mentioned_in: []       # populated lazily
#     domain: product | growth | leadership | strategy | writing | psychology | business | other
#     guest_authored: true | false   # whether the author appears as a podcast guest
#     verified_corpus_mentions: int  # rough grep count at seed time
#     notes: optional
#
# Book digests live in knowledge/books/<slug>.md and are generated on demand.

