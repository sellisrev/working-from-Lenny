<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working from Lenny</title>
  <!-- include: styles.css -->
  <style>
    /* home-namespaced launcher visuals. Featured band on top, then themed
       sections as tile grids. Each tile launches an app (sends the canonical
       chat message to invoke its entry tool / mount its ui:// resource) and
       links to the app's Claude Code skill. */
    .home-intro {
      color: var(--fg-muted);
      margin: 0 0 1.25rem;
      line-height: 1.5;
    }
    .home-build-marker {
      font-size: 11px;
      color: var(--fg-faint);
      margin-top: -8px;
      margin-bottom: 1rem;
    }
    .home-section { margin-bottom: 1.75rem; }
    .home-section-label {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg-faint);
      margin: 0 0 0.6rem;
      font-weight: 600;
    }
    .home-section.featured .home-section-label { color: var(--accent); }
    .home-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.75rem;
    }
    .home-tile {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 0.95rem;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .home-section.featured .home-tile { border-color: var(--accent); background: var(--border-soft); }
    .home-tile-name { font-weight: 600; line-height: 1.3; }
    .home-tile-line { font-size: 0.85rem; color: var(--fg-muted); line-height: 1.45; flex: 1; }
    .home-tile-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-top: 0.25rem; }
    .home-launch {
      padding: 0.4rem 0.85rem;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .home-launch:hover { background: #333; }
    .home-skill-link { font-size: 0.78rem; color: var(--fg-muted); text-decoration: underline; }
    .home-skill-link:hover { color: var(--fg); }
    .home-error {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fff4f4;
      border-left: 3px solid #c34;
      color: #1a1a1a;
      border-radius: 6px;
    }
    .home-error.visible { display: block; }
    .home-toast {
      display: none;
      margin-top: 1rem;
      padding: 0.6rem 0.9rem;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 6px;
      color: var(--warn-text);
      font-size: 0.85rem;
    }
    .home-toast.visible { display: block; }
  </style>
</head>
<body>

<div class="app">

  <h1 class="app-title">Working from Lenny</h1>
  <p class="app-tagline">Pick a tool. Or ask anything in the always-fresh ones up top.</p>
  <p class="home-build-marker">build: bridge-v1 / __WFL_BUNDLE_VERSION__</p>

  <p class="home-intro" id="home-intro"></p>

  <div id="home-sections"></div>

  <div class="home-toast" id="home-toast" role="status"></div>
  <div class="home-error" id="home-error" role="alert"></div>

</div>

<!-- include: mcp-rpc.js -->
<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }

  function showError(msg) {
    var el = $("home-error");
    el.textContent = msg;
    el.classList.add("visible");
  }

  function showToast(msg) {
    var el = $("home-toast");
    el.textContent = msg;
    el.classList.add("visible");
  }

  function parseToolResult(result) {
    if (!result || !Array.isArray(result.content)) {
      throw new Error("Malformed tool result");
    }
    var first = result.content[0];
    if (!first || first.type !== "text") {
      throw new Error("Tool returned non-text content");
    }
    return JSON.parse(first.text);
  }

  function launch(app) {
    var msg =
      "Open " + app.name + " from Working from Lenny. " + app.launch_hint;
    if (typeof window.mcp.sendMessage === "function") {
      window.mcp.sendMessage(msg)
        .then(function () { showToast("Opening " + app.name + " in chat below."); })
        .catch(function (err) {
          showError("Could not open " + app.name + ": " + (err && err.message ? err.message : String(err)));
        });
    } else {
      showToast("Ask Claude in chat: “Open " + app.name + "” (calls " + app.entry_tool + ").");
    }
  }

  function buildTile(app) {
    var tile = document.createElement("div");
    tile.className = "home-tile";

    var name = document.createElement("div");
    name.className = "home-tile-name";
    name.textContent = app.name;
    tile.appendChild(name);

    var line = document.createElement("div");
    line.className = "home-tile-line";
    line.textContent = app.one_liner;
    tile.appendChild(line);

    var actions = document.createElement("div");
    actions.className = "home-tile-actions";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "home-launch";
    btn.textContent = "Open";
    btn.addEventListener("click", function () { launch(app); });
    actions.appendChild(btn);

    if (app.skill_url) {
      var link = document.createElement("a");
      link.className = "home-skill-link";
      link.href = app.skill_url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "use as a skill";
      actions.appendChild(link);
    }

    tile.appendChild(actions);
    return tile;
  }

  function buildSection(label, apps, isFeatured) {
    var sec = document.createElement("div");
    sec.className = "home-section" + (isFeatured ? " featured" : "");

    var h = document.createElement("p");
    h.className = "home-section-label";
    h.textContent = label;
    sec.appendChild(h);

    var grid = document.createElement("div");
    grid.className = "home-grid";
    apps.forEach(function (a) { grid.appendChild(buildTile(a)); });
    sec.appendChild(grid);
    return sec;
  }

  function render(menu) {
    $("home-intro").textContent = menu.intro || "";
    var container = $("home-sections");
    container.innerHTML = "";

    if (Array.isArray(menu.featured) && menu.featured.length > 0) {
      container.appendChild(
        buildSection("Ask & learn (always fresh)", menu.featured, true),
      );
    }
    (menu.sections || []).forEach(function (s) {
      if (s.apps && s.apps.length > 0) {
        container.appendChild(buildSection(s.label, s.apps, false));
      }
    });
  }

  window.mcp.callTool("wfl_home", {})
    .then(function (result) {
      render(parseToolResult(result));
    })
    .catch(function (err) {
      showError("Could not load the menu: " + (err && err.message ? err.message : String(err)));
    });
})();
</script>

</body>
</html>
